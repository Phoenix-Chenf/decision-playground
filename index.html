    {title:'立场背后的关切',kind:'interests',subtitle:'三个追问，减少你自己的想当然',scene:'平台说“不要再加定制”，产品说“必须这季度做”。两句话看起来冲突，却可能分别指向维护负担与一个有限观察窗口。你主持双方的工作讨论，掌握三张可以追问的事实卡。目标不是证明谁防御、谁不合作，而是邀请当事人公开真实的约束与目标，整理共同关切和仍不能同时满足的部分。',mission:'选追问、查看预置回应，再将立场改写为关切和可讨论条件。',items:[['maintenance','为什么不加定制','平台已有三种分叉，每轮升级都要额外回归；不是一概反对新场景。'],['window','本季度的窗口是什么','产品有一组已同意参加两周试用的用户，不要求全量上线。'],['definition','什么算做完','双方还没明确试用之后谁维护、什么时候退出。']],event:['试用窗口缩短','用户现在只能参与一周。先确认最小观察结果，不把短窗口解释为必须跳过质量。'],sample:['问“定制会增加哪些维护”比问“为什么抗拒”更能得到事实。','保留两方不能让步的约束，同时寻找试点范围。','回应是角色脚本，只能练习提问，不证明现实人的动机。']},
    {title:'三个同价值方案',kind:'meso',subtitle:'改变结构，而不只是改一个数字',scene:'一项虚构的跨团队试点可以在范围、窗口、支援和维护上交换条件。产品想要更大范围和更多支持，工程更看重可控窗口与后续维护。你准备同时给出三个方案，而不是从一个苛刻报价慢慢后退。本局提供一个公开的玩具效用模型：它只用于让你看到交换结构，绝不代表现实中可量化所有价值。',mission:'做出三个不同结构、对提案方同价值的方案，并问另一方为什么偏好某个。',items:[['scope','范围 1–3 档','提案方每档 +4，合作方每档 -3。'],['time','窗口 4–8 周','提案方 + (8-周数)，合作方每周 +2。'],['support','支援 0–2 档与维护','提案方支援每档 +2，合作方 -2；维护另按公开规则计算。']],event:['支援来源变化','支援只能到一档。原第二方案需要重写；等价值不是为了把无法执行的方案也放进去。'],sample:['预置三个方案的提案方效用都为 14，结构不同。','合作方效用不同可以提示要追问的偏好，不是替对方选择。','如果模型漏了风险或关系成本，停止用等效用数字替代讨论。']},
    {title:'把预测写成条件',kind:'contingent',subtitle:'不必先争出谁对未来判断更准',scene:'业务估计新流程会明显减少客服工作，工程认为早期会有较多异常。双方对未来有不同预测，暂时没有足够数据证明哪一方更准。你希望把争论转成可观察的试点条件：如果出现某种结果，谁根据哪份记录采取什么行动。条件不能惩罚如实报告，也不能把一方无法控制的因素全部压给它。',mission:'写一份包含指标、来源、触发、行动、责任和复看时间的条件式约定。',items:[['measure','观察对象','先定义什么样的请求进入样本，保留异常。'],['trigger','触发条件','设置扩围、保持、回退的不同条件。'],['response','后续行动','谁执行、谁有批准权、什么时候复看。']],event:['指标发生口径变化','客服将转接也记成完成。先冻结原口径或重建可比样本，不能按新比例自动扩围。'],sample:['如果异常超出预先约定的边界，由值守者暂停并由负责人复核。','不只写“效果好就继续”，要让两方能查看同一来源。','这是教学约定，不是法律合同或统计实验设计的替代品。']},
    {title:'让步也要握手',kind:'concession',subtitle:'交换不是“我少要一点，你就该答应”',scene:'两队在谈一个临时支援。甲可以减少范围，乙可以提前交付一个接口，但双方都不知道对方让步背后的成本。你整理一张给出、换取、成立条件和批准者的交换表。交换应该帮助双方形成可执行组合，不是把每件事计成别人欠下的人情，也不把负责人尚未批准的资源拿来交易。',mission:'写三项条件交换，区分可以承诺的内容和只能提议的内容。',items:[['scope','减少场景','换取更早的最小交付，不默认同等业务价值。'],['support','提供样例与联调','换取减少往返，需要确认支援人可用。'],['maintenance','接手部分维护','换取试点支持，但要核实能力和期限。']],event:['对方接受了一半','对方接受缩范围，但没有同意提前交付。检查条件是否被拆开，不把单边让步当完整协议。'],sample:['将范围缩小与交付窗口写成一个条件包。','支援人在其他项目有承诺，不能由你单方面转移。','未成立的交换保留为建议，不登记为已承诺。']},
    {title:'拿什么作标准',kind:'standards',subtitle:'把依据与偏好摆在不同的位置',scene:'两个领域在讨论公共能力的优先级。一个提出“往年都是这样”，另一个提出“新业务更重要”，还有人拿出一份缺少分母的趋势图。你帮助参与人比较可复核的标准与个人偏好。标准也可能有适用边界，不能因为来自权威就免于检查，最终价值排序仍由获授权负责人决定。',mission:'给三个候选依据标注来源、适用范围和待补信息，再形成标准组合。',items:[['history','历史投入比例','可描述过去，不自动决定未来；业务结构已变化。'],['trend','完成率趋势','缺少样本边界、周期和分母，暂不能直接比较。'],['risk','风险与既有承诺','有明确记录，可以作约束；风险容忍需负责人确认。']],event:['趋势图补充了分母','新场景样本只有旧场景的十分之一。保留它的信号，但别把两个百分比当同等强度证据。'],sample:['用既有承诺与风险边界约束，再讨论新增价值。','将偏好公开，不必伪装成客观指标。','标准有争议时记录分歧和谁有权选择，不强求唯一公式。']},
    {title:'升级而不越权',kind:'authority',subtitle:'把问题交给正确的人，不把责任甩出去',scene:'试点讨论已经形成小范围方案，但一个条款会占用另一部门的维护容量。产品代表可以决定场景顺序，工程代表可以建议实现方式，你作为引导师只能组织过程。负责人可以调配跨部门资源，但不在现场。你需要把已达成的部分保留下来，明确哪些只是建议，以及升级时带什么选项。',mission:'对三项决定分别标注授权状态，制作一份带选项的升级请求。',items:[['sequence','场景顺序','本局产品代表可决定，但需要受容量与既有承诺约束。'],['resource','跨部门维护资源','必须由有授权的负责人批准；代表不能代签。'],['method','工程实现方式','由承接团队评估和选择，引导师不替它承诺。']],event:['负责人只回了“可以推进”','这句回复没有明确批准维护资源。记录已批准的范围，再追问重大条款，不将模糊背书扩大。'],sample:['按授权保留可做部分，不让一个条款阻塞全部讨论。','升级给出小试点、延期、增加资源三个选项及代价。','负责人一句“推进”不等于接受未明示风险。']},
    {title:'锚点与时间压力',kind:'anchor',subtitle:'先检查依据，再决定要不要加速',scene:'合作方一开场就说“别人一周就能做，今天必须确定”。这句话可能有真实的窗口约束，也可能只是未经核实的参考。你不能自动把它贴成操纵标签，也不应该因紧张就把比较条件和授权略过。你要从三种回应中选择，继续确认范围、质量、已有承诺以及真正的截止原因。',mission:'对三个压力节点选择回应，保留事实核验和可撤回的小承诺。',items:[['anchor','“别人一周”','先问比较对象与交付范围；相同名称不代表相同条件。'],['deadline','“今天确定”','问决定截止还是上线截止、错过的实际代价。'],['threat','“不做就换人”','核实替代是否可行，保持选择权，不威胁反击。']],event:['截止确有原因','试用用户次日离开，但可以保留访谈记录。考虑先确认需求，不必把全部工程交付压到今天。'],sample:['邀请对方展示可比较依据，不争论谁更努力。','真实期限可以认真处理，同时保留质量与授权。','先达成一个可撤回的小安排，也可以明确暂不成交。']},
    {title:'追加需求不白送',kind:'scope',subtitle:'变更成本进入共同选择',scene:'一项已承接的试点收到三个追加请求：一个必要修复、一个展示优化、一个新业务场景。每项都被称为“小改”，但它们会消耗同一窗口的剩余容量。你需要让参与人判断哪些纳入、哪些换出原任务、哪些延期。请求者不必先证明自己错了，承接者也不必靠拒绝所有变更维护边界。',mission:'在六点剩余容量内安排三项变更，明确换出的承诺与通知。',items:[['fix','必要修复','3 点，影响已定义质量边界。'],['polish','展示优化','2 点，改善可读性，不是当前必须条件。'],['new','新场景','4 点，需要新增验收与值守。']],event:['剩余容量降为四点','必须处理的外部交付占去两点。重新协商，不把完成后的工时账当作事前同意。'],sample:['修复 3 + 展示 2 超过事件后的四点，需要缩小或延期。','换出原任务必须由相关承诺方确认。','本局点数不是人天，也不表示功能价值。']},
    {title:'多方换座位',kind:'coalition',subtitle:'不同组合，仍要让受影响者可见',scene:'产品、平台和运营要形成共同试点。产品与平台很容易先约定技术方案，但值守落在运营。你设计联席、分段和代表协调三种路径，比较谁能看到影响、谁有批准权、什么时候回传。多方谈判不是鼓励两方联合施压第三方；关键是避免看似有效的局部协议向没有参与的人转移成本。',mission:'选择协调路径，并给每方标明关切、授权、确认方式与回传。',items:[['product','产品','重视场景结果；可排序，不可代运营接受值守。'],['platform','平台','重视复用与维护；可建议接口，不可调配运营。'],['operations','运营','重视值守可持续；需要看到试点窗口与回退条件。']],event:['代表换人','新代表还没获得部门确认。保留讨论，不把旧代表认可自动视为新授权。'],sample:['分段可提升效率，但关键条款需要所有受影响者再确认。','代表需要范围清楚的授权和回传机制。','不在场不等于默认同意，反对也可能是约束未被看见。']},
    {title:'不成交也有结果',kind:'walkaway',subtitle:'保留关系、替代行动和再谈条件',scene:'经过两轮交换，双方发现本季度容量与风险边界暂时不能兼容。负责人可以选择完整合作、缩小试点、暂停或退出。你整理的是可执行结果，而不是必须达成共识的戏剧结尾。任何结果都要有负责人、通知对象和下一次条件；退出也不能取消已经成立且仍有效的既有承诺。',mission:'比较四种结果与可执行替代，明确暂不成交的后续安排。',items:[['alternative','可执行替代','保留手工观察或延后复用，需要相应资源确认。'],['existing','既有承诺','暂停新增合作不自动解除原有支持。'],['return','重启条件','写清新容量、证据或授权出现后由谁重新召集。']],event:['关系顾虑浮现','对方担心暂停会被解释成不支持。公开说明是约束选择、不是评价个人；不承诺不存在的未来资源。'],sample:['暂不成交可以留下已确认的事实和替代行动。','小试点要有独立的范围与验收，不只是把大承诺改名。','退出后仍执行既有承诺，并明确何时值得再谈。']}
  ];

    deliverables:['一份初始选择及其依据','变化后的条件包或停止安排','批准者、承接者和待确认事项'],debrief:['什么是已知事实，什么还只是估计？','哪项关切通过提问而非猜测被澄清？','谁选择、谁批准、谁实际承接？','最大反证是什么；换一种条件会不会得出不同结果？'],principles:['把立场、关切、替代行动与授权分开。','让步、范围、维护和窗口一起进入选择。','可执行且获确认，比口头统一更重要。'],pitfalls:['把预置回应当真实人心理，或把算术当职业评分。','把没有拒绝当同意，把主持人建议当负责人批准。'],sample:r.sample,transfer:'先获得场景与资料授权。真实任务需要相应决策人、相关方和承接者确认；练习记录不证明采用与效能。',reference:references[n===3?1:n===4?2:0]}));

(() => {
 const scenarios=[
  ['F1','复盘不是找罪人','cause','retrospective','一个虚构团队刚结束一个交付周期，大家知道发生了返工，却对等待、误解与变更的影响各有上下文。有人记得客户临时改需求，有人记得验收样例很晚才明确。你邀请大家复盘工作系统，而非认定谁不够负责。需要把观察、解释与最小改变放到不同的位置，保留正向经验与反例。',['等待三天','两个版本口径不同','一次顺利的快速校准'],'新材料显示等待中两天是权限确认，不是开发时间。','将原因判断改成可检验机制，并让成员主动选择一项改善。'],
  ['F2','客户旅程证据地图','journey','journey','一个虚构服务准备改善客户首次完成任务的体验。团队手中有页面退出数据、三段访谈和一份客服摘要，来源强度不同。旅程图可以整理经历，却不能让团队代用户描述情绪，更不能把退出位置自动当根因。你要让各方围绕用户任务识别证据、假设和下一次观察。',['发现服务','理解与选择','完成与后续反馈'],'一段访谈来自高频用户，不能直接代表首次使用者。','画出用户任务、实际证据、替代解释与验证点。'],
  ['F3','新团队启动握手','coverage','teamkickoff','一个虚构的新团队由业务、产品、研发和运营组成，成员来自不同旧团队。负责人已给出方向，但大家尚未公开工作习惯、已有承诺与不能代签的事项。启动会不是欢迎仪式，也不是必须先制造冲突。你帮助团队形成共同边界与第一阶段交付，再让成员选择具体分工。',['目标与授权','能力与既有承诺','协作与第一阶段验收'],'一位关键成员仍兼任原团队维护，需要公开约束。','公开共同目标、授权、旧承诺、角色接口与首轮验收。'],
  ['F4','Working Agreement 试运行','agreement','agreement','一个虚构团队对协作总体满意，但响应、决策记录、变更通知和专注时间的理解不同。你不打算写一份由主持人单方面发布的纪律文件。各方先陈述真实需要，再为少数高频行为提出可观察的约定，并决定谁维护、何时复看、如何提出例外。约定不覆盖公司制度，也不放大领导权限。',['响应与专注','决定与变化通知','例外与修订机制'],'团队新增跨时区协作，原即时响应约定不再适用。','形成少而可观察、双方确认、允许例外的协作约定。'],
  ['F5','创意到验证的阶段门','gate','innovation','一场虚构创新活动已经收集到许多想法。你要帮助组织从点子走向可验证判断，而不是用热闹的投票代替商业论证。每项创意需要区分用户问题、商业假设、最小试验和已有证据。负责人可决定投入上限，评委按事先对齐标准给建议，获奖不意味着上线或收益。',['创意问题','商业论证','最小试验与后续跟踪'],'获奖方案只有演示，没有正式权限或真实使用。','为阶段分别记录入口证据、判断者、资源和继续/停止条件。'],
  ['F6','评委规则校准局','matrix','innovation','虚构创新评审即将开始，三个评委分别偏好技术新颖、商业空间和快速落地。偏好并不需要被抹平，但评价口径必须事前公开，并允许处理关联利益。你选择几份匿名教学方案共同校准，区分可复核事实、评分偏好和负责人最终投入决定。',['成熟演示但价值未证实','需求证据强但实现未知','增量小但已有人使用'],'一位评委参与了其中方案辅导，需要披露并按组织规则处理。','对齐证据维度和评分边界，再比较投入，而非把高分当收益。'],
  ['F7','年度目标的未来倒推','sequence','annual','虚构部门计划未来一年。各领域已有方向想象，但核心目标和基础依赖还未公开。你让大家描述一年后可观察的业务状态，再倒推半年和首个窗口的交付。负责人收敛 TOP3，参与人选择实现路径；路线图应保留学习与调整点，不能成为假装确定未来的甘特图。',['公开年度结果与约束','验证关键假设与公共依赖','领取首阶段交付并共同验收'],'负责人强调先验证一个完整路径，而不是同时开全部方向。','检查前后依赖，区分年度意图、季度选择与当前承诺。'],
  ['F8','季度组合取舍','portfolio','quarter','虚构组织为下季度列出六个候选方向，已有承诺占了不少容量。每个方向有不同投入与证据强度，不能只按声量或历史习惯决定。你整理至少两套组合并展示各自放弃什么；负责人拍优先级，承接方核实可执行条件，不能把表上的点数当作跨团队生产力。',['保住已成立承诺','验证关键新假设','扩大已验证能力'],'一个已承诺事项成为必须处理的约束，剩余教学容量从八点降为六点。','比较组合、机会成本和风险，再选择最多三个方向。'],
  ['F9','内部教练组的服务边界','coverage','coaches','虚构组织希望组建内部教练协作组。成员有课程、辅导和业务专长，但不能代替团队负责人做业务决定。你公开它能提供的资源、申请方式、投入边界与成功证据，防止变成一个替所有团队包办改进的中央机构。需要让受辅导团队自己表达需要并保留自主性。',['服务申请与授权','教练投入和角色边界','受辅导团队反馈与退出'],'申请量增加，但两位教练本职任务已有承诺。','设计拉动式服务与容量边界，不以课程数量当组织效果。'],
  ['F10','新人拉取成长资源','gate','talent','虚构团队迎来校招、社招、转岗和内部流动的新加入成员，其中有人已有多年经验，也有人刚开始工作。他们需要理解本团队的目标、工具、协作边界和维护方式，不是统一从零补课。组织可以提供案例、任务、反馈和专家时间，但融入与成长的第一责任人仍是个人。你帮助每个人依据已有经验选择真实任务并主动请求资源，负责人明确风险边界。交付一次示例不等于已经掌握本团队的工作方式，需观察另一任务上的独立判断。',['盘点已有经验与资源请求','有边界的首项协作任务','独立迁移与维护反馈'],'一名有经验的转岗成员已完成示例，但仍沿用旧团队的工具权限和验收习惯。','区分已有能力、本团队上下文、协作表现和独立迁移，不按入职渠道一刀切。'],
  ['F11','课程共创与教回去','journey','learning','虚构组织准备一门协作课程，讲师能讲概念但希望听众能在实际工作中判断。你把学习体验拆成问题、示范、练习和教回去，再让参与人设计不同工作场景。课程好评不是业务收益；练习通过也不等于未来能独立主持。需要为后续应用留下选择权与反馈窗口。',['理解真实问题','练习并教回去','实际应用与复看'],'课程结束后有人没有适用场景，不能要求为了完成而强行实践。','用输出与迁移观察设计学习，不以出勤或满意度代替能力。'],
  ['F12','敏捷推广的反例复盘','cause','change','虚构组织的多个团队在尝试新的工作方式，其中一个团队反馈很好，另一个团队觉得维护负担上升。你帮助组织保留不同结果，检查目标、授权、原流程和实际适配，避免把试点成功说成普遍有效。推广不是把同一套仪式复制到所有团队，而是让团队选择有帮助的机制。',['正向试点结果','维护负担上升','原流程与授权差异'],'正向试点同期减少了外部依赖，不能把改善全部归因于方法。','保留反证、基线与同期变化，决定继续、缩小或停止。'],
  ['F13','新成员内部工具导航','journey','tooling','虚构团队同时使用内部知识库、任务协作系统、即时沟通和代码平台。新加入成员拿到几份旧链接，却不知道哪份是当前说明、任务状态以哪里为准，也不知道什么应在聊天中确认、什么必须进入正式记录。你让成员围绕一个小交付主动探索工具，而不是记住所有菜单。所有界面与记录由教学卡提供，不登录真实内部软件，也不借用他人账号。',['找当前说明和工具Owner','在原任务载体完成首轮协作','让决定与维护可追溯'],'群聊中的“已经好了”与任务系统的“待验收”不一致，旧说明还指向已停用入口。','画出工具用途、事实源、权限Owner与交付记录之间的关系，完成一条可复核协作路径。'],
  ['F14','权限与资料边界握手','authority','tooling','一名虚构的新加入成员需要阅读协作文档、维护任务状态并提交小改动。负责人支持尽快融入，但“可以学”“可以看”“可以编辑”“可以向外分享”不是同一授权。已有账号也不意味着原团队权限适用于新团队。你帮助成员按目的、对象、范围、Owner和期限请求最小必要权限，遇到不可读材料就用脱敏样例或找授权人，不在游戏中填写账号密码、密钥或真实人员资料。',['阅读目的与资料范围','编辑与提交的维护边界','转岗权限和分享范围'],'成员仍能打开原团队的私域链接，有人建议把完整材料复制给新团队以便学习。','确认读取、写入、提交与分享的不同权限，不能把可访问当已获授权。'],
  ['G1','资源冲突的条件包','portfolio','resources','虚构的两个领域都希望同一组公共能力投入，彼此不是不合作，只是已有目标和窗口不同。你公开资源约束与各自关切，帮助双方提出缩范围、改窗口、复用与停用的组合。负责人负责跨域取舍，各队决定实现并确认旧承诺受到什么影响。',['原承诺不可空转','小范围新试点','公共能力与维护投入'],'关键支援人仍被原项目占用，原方案的可用容量需要下降。','比较资源组合与替代行动，不凭主持人权威分配人员。'],
  ['G2','冲突领航的暂停键','conflict','conflict','虚构的跨团队讨论出现了指责和抢话，但还没有触及安全事件。你作为引导师有过程委托，没有裁判谁人品好坏的权限。目标是让当事人自愿回到具体事实、影响和需要，再判断是否继续共同讨论。若出现威胁、骚扰、报复或严重权力不对等，应按正式组织程序处理，不能靠游戏和共同承诺覆盖。',['把标签改成具体观察','确认愿意公开的影响与需要','讨论继续/暂停与正式处理'],'一方明确不愿在公开场合继续。尊重选择，不强迫和解。','区分可引导讨论、需要暂停和应转正式处理的情境。'],
  ['G3','四队依赖集市','coverage','dependencies','四个虚构 Scrum 团队服务同一产品，共用一项产品目标和公共接口。你帮助代表公开依赖对象与交付窗口，并回队确认容量和验收。跨队协调不意味着代表能替开发者安排实现，也不应让中心报表覆盖各队的原有工作载体。需要保留产品目标、统一质量边界和具体接口。',['上游输入与质量标准','下游场景与验收样例','跨队变化通知与回传'],'一个代表更换，旧授权无法自动转移给新代表。','确认接口与回传，不把代表发言直接升级为全队承诺。'],
  ['G4','组织级共同地图','coverage','largeassembly','一个虚构的 125 至 500 人组织准备年度共创。每个领域有事实与愿景，没有必要预设激烈冲突。你让小组先表达，再通过授权代表汇总共同点、差异和未决事项。组织负责人决定组织级方向；小组保留实现选择。大会议厅里的举手不能替代未到场者的表达和承诺。',['分组输入与少数意见','代表授权与主题汇总','组织决定与全员回传'],'某组的少数意见在汇总时丢失，需恢复原输入并明确记录来源。','让层级收敛可追溯，不把多数偏好当全部人的认可。'],
  ['G5','代表授权的传话链','authority','largeassembly','一个虚构组织的全员大会将由二十位领域代表参与决策收敛。代表来自小组，但被推举不等于可以承诺所有资源。你帮助每个代表说明可建议、可承诺和需要回组确认的范围，再检查决定如何传回与修订。共同方向与实施同意需要分层处理。',['可以提出的建议','可以作出的承诺','需要回组/负责人确认的条款'],'代表把“倾向”传成“决定”，影响了其他组安排。','建立授权与回传原句，保留出处和未决状态。'],
  ['G6','全员大会的参与预算','sequence','largeassembly','虚构的 500 人大会有全天场地，但只有主引导师和几位协助者。你不能让五百人轮流对同一问题发言，也不能把参与度寄托在热闹的投票。会前建立分组与桌主持，在现场保留个人书写、桌内交换、主题区汇总和负责人回应，最后回桌校准。需要考虑噪声、可达性、休息和不同表达方式。',['个人与桌内输入','主题区汇总与代表收敛','负责人回应后回桌校准'],'场地音响故障，分组输入仍可继续，中央收敛延后。','检查顺序、承载与备用方案，不能删掉回传来赶时间。'],
  ['G7','无明确授权的边界局','authority','decision','虚构协作会议发现真正决策人不在场，参与人仍能提供事实、提出备选与确认局部接口。你要避免两种极端：为了看起来有产出而越权拍板，或因缺一个人就取消所有有用工作。把当前可以形成的产物与需要授权后生效的决定分开，并安排带选项的升级。',['事实与局部接口','资源与重大风险','升级选项与再确认窗口'],'负责人只回复“你们看着办”，关键风险范围仍不明确。','有用准备与正式决定分层，不扩大模糊授权。'],
  ['G10','工作流净收益复测','cause','workflow','虚构团队使用脚本和 AI 协作维护状态，记录变整齐了，但还不知道是否减少净耗时。你固定同类事项与两个可比较窗口，计入新增维护、人工复核、异常和质量。结构检查可以交给脚本，事实、采用与归因由人核对。不要把代码量或自动化次数当作效能。',['原流程追问与等待','新流程维护与复核','关闭质量与同期变化'],'新窗口事项复杂度降低，直接比较平均时间会高估效果。','先检查样本可比性和有效分母，再做有边界的结果表述。'],
  ['G11','服务迁移的里程碑棋盘','sequence','change','虚构业务计划迁移供应、商品、客服和横向系统。各方的任务有不同前置条件、批准和回退机制。你帮助参与人倒排一个有验证点的计划，允许并行准备，但不把演示、试点与正式迁移混写。业务负责人选择风险与窗口，领域负责人承接交付，教练支持依赖暴露。',['验证输入与权限','有限迁移与回退演练','正式切换与后续观察'],'外部授权晚于切换日，不能通过改表格日期让前提成立。','检查不可跳过的前提和回退，保留并行但不倒置依赖。'],
  ['G12','跨领域策略与矛盾共存','matrix','annual','虚构组织既要快速探索，也要提高公共能力稳定性。两个目标都可能重要，不能靠“都要”完成资源取舍。你邀请各领域公开假设与机会成本，分别比较小试验、稳态投入和退出低价值工作的方案。负责人拍最重要方向，不必让所有领域喜欢同一方案，但需要让取舍清楚且可回传。',['快速探索小试点','稳定公共能力','退出低价值维护'],'稳定性风险被新证据提高，原组合应重新核对而非继续加任务。','比较证据强度与代价，负责人取舍后保留不同关切。']
 ];

 const games=scenarios.map(([id,title,kind,theme,scene,labels,event,mission])=>({id,title,family:id[0],engine:'facilitation',subtitle:mission,minutes:['G4','G6'].includes(id)?90:40,players:'单组 / 多组 / 授权代表',level:id[0]==='F'?'实践':'组织级',scene,mission,theme,roles:[r('参与人代表','先把我知道的事实放出来。','有一项已承诺工作和一个未公开假设；没有授权代替其他人承诺。','选择可执行路径并保留关切。','未知可以待确认，不把猜测说成他人动机。'),r('相关方代表','我愿意校准范围和验收。','有自己的原任务与资源限制；愿意试，但需要明确窗口、质量与变更。','共同理解而非被安排。','支持方向不等于所有资源都已可用。'),r('获授权负责人','把最需要我选择的事项摆出来。','目标和风险取舍由我批准，实现与承接仍由参与人选择。','方向收敛且能复看。','不代所有人签署，不把主持人建议当已执行结果。')],materials:[{title:'起点',text:'摆出事实、关切与未来想象；不要求先有明确冲突。'},{title:'操作对象',text:labels.join('；')},{title:'分工边界',text:'负责人收敛方向，参与人选择与承接，相关方共同验收，引导师负责过程。'}],rounds:['会前核对委托、授权、输入与参与人；个人先表达事实。','操作本局的地图、顺序、组合或阶段门；相关方共同校准。','揭示变化并保留反证；留下责任、验收、回传与检查点。'],event:{title:'新的上下文',text:event},config:{kind,theme,budget:8,eventBudget:6,items:labels.map((label,i)=>({id:`i${i+1}`,label,cost:[3,4,2][i],detail: i===0?'先核对已有来源、边界与必要前提。':i===1?'邀请受影响者公开上下文，保留替代路径。':'明确责任、验收、回传和复看；不把填写当兑现。'})),edges:[['i1','i2'],['i2','i3']]},deliverables:['本局地图或条件包','实际选择与批准边界','承接、验收、回传与待确认记录'],debrief:['什么新上下文改变了原判断？','谁能选择什么，谁还需要批准？','哪个反例会让你缩小或停止？','决定如何回传，谁会核对实际兑现？'],principles:['个人贡献、团队决定、采用与效果分层。','参与人主动承接，验收由相关方共同校准。','工具支持事实和选择，不替代专业判断。'],pitfalls:['把参与热情、评分、出勤或文档长度当结果。','把主持人、代表或负责人一人同意当所有相关方的同意。'],sample:[mission,event,'一种有效结果是有依据的继续、重谈、暂停或停止，并给未决项安排确认人和窗口。'],transfer:'先核实委托、权限和可用资源。组织级玩法需代表授权、协同主持与回传；不推定Phoenix Chen已经在每种规模验证过此法。'}));
 const practice={
  F1:{inputs:['周期记录显示接口确认等待3天；第一次请求与权限批准时间可复核，但未记录实际工作时长。','产品与研发分别引用验收样例v1和v2；版本变更没有共同通知记录。','另一次需求在开始前交换了3个样例，同一窗口内没有发生口径返工；只是一个正向实例。'],sample:['把“接口团队慢”改成“请求到授权有3天等待”，将人身评价移出记录；等待不是3天投入。','机制假设是未在请求时明确批准者；反证是有批准者的事项仍可能因容量等待。版本口径问题另起一条假设。','由一名自愿承接者试用“输入附批准者、样例版本与接收确认”，相关方先校准必要字段；下一周期对同类事项复看。','事件后将2天权限等待与1天其他等待分开，不能仍把3天全部归为研发低效；保留一次顺利校准的方法。']},
  F2:{inputs:['教学访谈：3名首次使用者中2名不知道服务是否覆盖自己的地区；人数很小，来源为本局虚构记录。','页面记录只说明某一步退出，不区分未覆盖、暂时离开、阅读后去其他入口等原因。','客服摘要含后续投诉，但没有与首次旅程的逐人对应关系；一段访谈实际来自高频用户。'],sample:['“发现”阶段记录任务是确认是否能用服务；“理解”阶段是判断范围与代价；“完成”阶段是确认结果和后续入口。','在图上区分用户原话、行为记录和团队解释；不能把“退出”自动填写成“用户焦虑”。','候选解释是覆盖提示不明确，也保留用户只是比较多个入口的解释；先观察5次获准的首次任务，不预设统计代表性。','事件后把高频用户材料移到独立旅程，不删除其原话；首次任务的判断置信度降低，安排补证据。']},
  F3:{inputs:['业务方向已确定为完成一条小范围服务路径；预算、风险上限由负责人决定，实现方式尚开放。','一名研发每周仍有2天旧系统维护；运营可提供教学样例，但不能批准外部承诺。','成员对“可以自己决定什么”没有共同解释；第一窗口拟定两周，还没有共同验收。'],sample:['会前把已确定与可共创分开；启动现场先陈述旧承诺和角色接口，不要求每个人先提出分歧。','参与人提出先走通一条路径，再分别主动承接输入整理、实现和验证；研发公开其维护约束，不能被算作全额可用。','承接人自提“两周后用3个教学样例演示完整路径并记录异常”；相关方共同校准样例、质量要求和演示形式。','负责人选择方向与容量，未领取的工作保留未决并约定确认人；首轮复看团队边界，而不把启动会热情当交付。']},
  F4:{inputs:['成员希望有连续专注时间，也希望阻塞事项不会长时间无人确认；双方需要可以同时成立。','决定散落在聊天与任务记录中；不是每条讨论都需要正式记录，但影响范围的决定需要固定出处。','成员可能请假或跨时区；没有预先指定紧急事件升级路径，主持人无权另行规定全天待命。'],sample:['草案一：普通阻塞在双方约定的重叠工作窗口确认接收，不要求立即解决；紧急事件走已有正式机制。','草案二：改变已承诺范围时，由提出变更者在原任务载体写决定、受影响者和待确认；接收方明确确认。','草案三：试运行两周，由成员自愿维护；一次只改3条高频行为，保留例外和无需公开私事的请假安排。','跨时区事件后将“即时响应”撤回为分区窗口和升级安排，相关方重新确认；共同约定不是对公司的制度或专业责任做替代。']},
  F5:{inputs:['创意甲有明确教学用户任务和2段原话，但还没有证明有多少人遇到问题。','创意乙提出商业空间估计，尚没有付费、持续使用或替代方式的数据。','创意丙完成了演示，但没有试点授权、责任人、维护投入和后续观察计划。'],sample:['问题阶段只确认任务、当事人证据和替代方案；商业阶段另看价值与投入假设，不靠演示倒推需求成立。','负责人允许一个有上限的试验，创意提出者主动承接；评委校准“证据、学习价值、可执行条件”，不直接授予上线资格。','给演示方案登记“演示完成、试点待批准”，要求责任、窗口、停用和维护条件；获奖与采用分栏。','若最小试验推翻关键假设，保留终止记录和学到的内容；如果继续，追踪谁实际用了什么，不只追踪奖项。']},
  F6:{inputs:['方案甲界面完整、5次教学演示顺利，但没有真实任务使用记录。','方案乙有任务证据与替代成本，技术实现和维护仍未验证。','方案丙创新幅度较小，有少量持续使用记录，但收益与同期变化尚未分开。'],sample:['先让评委独立说明同一份匿名材料支持什么、不支持什么，再公开分歧所在的证据和偏好维度。','“价值已有证据”和“技术已演示”分别评分或注明，不让漂亮展示给所有维度一起加分。','一名评委参与过方案辅导时先披露，由组织按现有规则决定回避、独立复核或保留意见；主持人不能自创豁免。','高分可成为投入建议，正式资源选择仍由负责人决定；评委保留不确定点，后续用采用记录复核评审判断。']},
  F7:{inputs:['年度结果描述是“目标用户能可靠完成一条完整任务”，需进一步定义用户、任务、成功与质量。','公共数据接口与关键权限还未验证；先做全面扩围可能依赖尚不存在的能力。','首阶段可以由领域负责人主动提出路径、协作与验收，但不能先把年度想象当成保证。'],sample:['次序可以写为年度结果与约束→关键假设/公共依赖验证→首窗口承接；实现准备可以并行，批准和验证不能假装已经成立。','负责人从候选方向收敛TOP3；参与人分别给半年、季度和当前窗口的可观察状态，不把三层目标混成任务清单。','事件后改为先走通一条完整路径，未入选方向登记重新讨论条件；首阶段承接者提出样例和质量证据，共同校准。','若公共依赖验证失败，则重排或缩小，不为了保住原路线图而隐去未知；年度目标保留调整窗口。']},
  F8:{inputs:['保住已成立承诺需3点、验证关键假设需4点、扩大已验证能力需2点，容量为8点；全部是教学模型。','每项有不同证据和责任条件，不能用点数将不同团队的生产力等同。','原承诺变成必处理约束，事件后只剩6点；原方案必须重新核对。'],sample:['初始组合可选3+4=7点，放弃扩围；另一个组合3+2=5点，留下更大风险余量但暂缓关键验证。','负责人比较两套组合的机会成本；承接人确认真实可用条件，而不是看总和未超就算批准。','事件后3+4=7点超界，可选3+2=5点，或请负责人授权缩范围后的新验证；不能把交换选项当已释放容量。','记录未选方向的下一窗口和重新打开条件，保留责任与共同验收；选择没有唯一标准答案。']},
  F9:{inputs:['申请团队希望改善依赖握手，愿意投入一次准备和两次复看；申请的是过程支持，不是替它交付业务。','两位教练本职工作已有承诺，本周期仅能分别提供半天；成员能提供的课程与辅导时间不同。','服务需要委托人、参与责任人、材料权限与退出条件；没有申请不代表团队能力不足。'],sample:['公开一个拉取入口：团队说明目标、现状、希望的帮助和能投入的时间；教练组答复可提供与不能提供什么。','把本周期服务缩为一场依赖工作坊和一次复看，由团队自己承接改进；不承诺包办全部问题。','反馈看团队是否能在另一事项上独立完成握手，而不只统计授课小时或满意度。','申请量上升后公开等待、替代资源和容量，必要时停止接新单；本职责任不因教练身份消失。']},
  F10:{inputs:['新加入成员盘点已有经验，主动选择一项协作任务：有人要学习内部软件，有人需要熟悉协作工具与维护规则，也有人主要缺业务上下文。','支持人提供当前说明、教学样例和反馈；负责人批准风险与权限边界，不统一强制参加从零开始的课程。','一次示例通过只证明这一情境的表现；有经验的转岗者也可能误用旧团队权限、事实源或验收方式。'],sample:['先问已有能力和本团队缺失上下文，再由成员选择任务、请求资源；社招和转岗者可以跳过已经掌握的基础内容。','把工具使用、协作握手与实际交付放在同一条任务链；观察是否找到事实源、维护Owner、权限范围和验收。','分别记录独立完成、获得提示及仍待确认的判断；第一次合入不直接证明已融入团队或产生业务收益。','再选择一项不同材料或协作对象的迁移任务。没有适用任务时允许暂缓，不为了证明成长而制造无意义实践。']},
  F11:{inputs:['课程目标是让参与人能把模糊依赖改写成对象、窗口、质量和确认人，而非记住术语。','课堂案例、示范、练习和教回去可观察；课后是否有合适工作场景因人而异。','学员在教学案例上答对，但可能只是复述讲师，尚未验证真实应用。'],sample:['先让学员用自己的话描述一个协作问题，再示范如何区分事实与解释，之后练习一个不同的虚构案例。','教回去要求学员给同伴说明判断依据和反例；讲师看迁移过程，不按发言热情认定能力。','课后应用自愿申请反馈，有合适场景的人带脱敏前后材料；无场景者可停在练习，不要求伪造应用。','满意度保留为体验指标，另记任务表现、独立判断和实际应用；课程开发者不独占团队改善结果。']},
  F12:{inputs:['团队甲试点后等待缩短，但同期减少了外部接口数量；不能直接归因于新机制。','团队乙每周维护记录新增90分钟，尚没有观察到返工减少。','两个团队的授权、已有流程和事项复杂度不同，强行对比平均值风险很高。'],sample:['分别描述两个团队的原目标、采用了哪些机制、投入和观察窗口；失败材料不从推广汇报中删掉。','团队甲记录改善与同期依赖变化，下一窗口匹配同类事项；团队乙先缩小字段和频率，再观察净负担。','推广建议改为一份可选择的机制清单与适用条件，团队主动试用，不复制全部仪式。','若小范围仍无净价值，停止并保留学习；适配有价值不等于所有组织应该采用。']},
  F13:{inputs:['知识库当前页v3由文档Owner维护；群聊置顶仍是v1，不能仅因出现较早或大家常转发就当权威。','任务协作系统记录责任人、验收与状态；聊天能澄清上下文，但不自动改变任务状态。','代码平台保存版本与评审；知识库里的“已完成”还需链接相应版本和使用记录。'],sample:['按“我要完成什么”选择工具：知识库找边界和流程，任务系统承接与验收，聊天确认未知，代码平台留差异与评审。','遇到旧链接先找文档Owner核对版本和入口，保留原引用；必要时提出修订，不擅自大范围删除旧材料。','对“已经好了”和“待验收”核对交付物、确认者与窗口，再由责任人更新原任务载体；不把同一状态复制到多个无人维护的表。','成员交付一张工具/事实源地图和一条脱敏操作轨迹；能说清遇到权限、状态不一致或入口停用时找谁。']},
  F14:{inputs:['阅读一份面向团队开放的说明，需要核对用途与可读范围；能看见链接不代表所有附件都开放。','任务状态和仓库文档写权限只涵盖已获授权对象；编辑权不自动包含批准、合并或发布权。','原团队私域访问可能是残留权限，完整复制到新团队又是不同分享动作；均不能自行推定合法。'],sample:['每个请求写清目的、资料对象、读/写/提交/分享范围、权限Owner与期限；缺权限时请求批准或使用教学样例。','把负责人支持融入理解为目标背书，不理解为越过系统Owner或资料Owner授予所有权限。','事件后停止读取或复制不属于当前授权范围的材料，向权限Owner核对并按正式流程处理残留访问；不展示真实凭证。','准备一份最小权限清单和到期/离队移交安排；同事代登、共享密码与偷偷复制不能成为赶进度的替代。']},
  G1:{inputs:['教学容量8点；原承诺3点、新试点4点、公共维护2点。两领域都需要公共能力，但交付窗口不同。','公共维护能降低未来负担，却不能在尚未实现时被当作当前已经释放的资源。','支援者仍在原项目，事件后容量6点；代表没有单独取消原项目的权限。'],sample:['摆出两领域的原承诺与真实窗口，至少比较“原承诺+试点”7点与“原承诺+维护”5点，并注明各自放弃什么。','负责人作跨域取舍，领域负责人主动承接实现；公共能力团队先说明能够给出的支持和维护边界。','容量变为6点后不继续按7点执行；可缩试点、调窗口、改为5点组合，或带条件包升级。','凡交换原任务，先核对原受益方是否接受以及资源何时真的释放；主持人不因协调成功而拥有人员分配权。']},
  G2:{inputs:['公开记录是两次打断和一句“你们总是不配合”；后一条是概括评价，不是可直接核验事实。','一方愿意描述交付受影响，但不愿公开个人私事；另一方记得不同的请求版本。','变化后，一方明确不想在共同场合继续；此时没有共同继续的同意。'],sample:['将“总是不配合”转为具体请求、时间、回应和影响，邀请双方核对来源，而非裁判谁更真诚。','询问哪些需要愿意公开，允许不回答；引导师只记录当事人自己表达的关切，不代其心理解释。','事件后暂停共同讨论，分别确认是否愿意以其他安全方式继续；不同意也能形成暂停、保护原承诺和升级安排。','若出现威胁、骚扰或报复风险，转正式程序；不通过强制握手、集体投票或一个负责人表态来宣布和解。']},
  G3:{inputs:['团队甲提供接口，乙完成用户入口，丙负责交易路径，丁负责观测；各队仍保留自己的实现与容量责任。','接口质量可共用产品的完成标准校准，具体接收场景还需要验收样例和版本。','一个代表被换人，新代表尚未获得旧代表的承诺授权，原接口决定需要追溯。'],sample:['每条依赖写对象、版本、窗口、接收方样例、变更通知和双方确认；产品目标共用，但不让协调者中央分配各队任务。','代表带着明示授权交换候选，回队由实际责任人确认容量与实现；产品价值排序仍在原责任边界内。','变化后保留旧决定出处，新代表先确认可继承哪些授权；未确认条款标待确认，不默认自动接班。','质量边界与接口验收分开但相容，使用原有任务载体避免双重台账；共同产品的多个团队不应各自发明互斥的完成标准。']},
  G4:{inputs:['125人默认16组，500人默认63组；是教学分组，各组按真实工作边界调整并核对总人数。','某组多数倾向扩围，少数意见指出维护人员尚未落实；两条都应带出处。','主题汇总只留下“全体支持扩围”，原少数意见被丢失；当前摘要不能代表真实输入。'],sample:['先个人输入再桌组交换，每组保留事实、候选、差异、授权；主题区只做有出处的归纳，不覆盖原材料。','恢复少数原句，并说明它影响的是维护条件而非一定反对方向；负责人比较带条件的方案。','组织TOP3由负责人取舍，桌组主动领取具体工作，自提验收后相关方校准；回传不等于广播一次摘要。','建议、组织决定、领域承接分别记录；500人全员同场采用桌内/主题区/代表/回桌，而不是500次全体发言。']},
  G5:{inputs:['本组授权原句是“可以推荐方向A，资源安排要回来确认”，代表只能作建议。','另组授权原句是“在已批准窗口内承接一项接口改动”，承诺受窗口与范围限制。','传话后“倾向A”被写成“已决定A”，上游据此调整了安排。'],sample:['逐条摘录可建议、可承诺、需回组与需负责人批准的范围；当选代表不自动扩大权限。','恢复原句并通知受影响方撤回对正式决定的理解，保留此前误传和修改时间，不悄悄覆盖。','负责人批准方向后仍需资源相关方确认实现，回组明确“已经决定什么”和“仍在确认什么”。','跨组代表不能代不在场者同意，未决给确认人和窗口；记录准确比一页看似整齐的全绿表更重要。']},
  G6:{inputs:['500人的360分钟核心设计含30分钟休息与材料整理；会前准备和会后确认另计。','默认63桌约8人，进入10–12主题区再到授权代表桌；需要桌主持、总控、材料和场地支持。','音响故障不影响纸面输入，但中央回应无法按原时间开展，不能让同意环节悄悄消失。'],sample:['次序是个人/桌内输入→主题区汇总与代表收敛→负责人回应后回桌校准；允许分区并行，但回桌不能先于决定。','同场版给不能公开发言的人书写渠道；代表版分2–3阶段留事实核对时间，两种都保留原输入和少数意见。','音响故障后继续桌组输入，主引导师与总控决定中央收敛改期或转书面；不靠压缩休息和取消校准硬凑结论。','会前彩排材料回收、主题映射、授权与应急，用一组材料全链条模拟；人数和主持配置是筹备建议，不是已验证公式。']},
  G7:{inputs:['与会者有权核对事实和已承诺接口，不能新增跨域资源或接受重大风险。','真正决策人缺席，但可以异步回答带明确选项的请求。','“你们看着办”没有说明资源上限、风险或可退出条件，不能视为无限授权。'],sample:['先完成共同地图、局部接口核对和两套备选；把资源取舍明确标为待批准。','升级请求包含要拍什么、A/B方案、代价、默认等待安排和最晚确认窗口，而非只甩一个模糊问题。','对模糊背书追问授权范围；未获确认时保留可逆准备，不向其他团队承诺尚不存在的资源。','负责人回应后由实际承接人确认，重大变化重新校准；无授权不等于会议无价值，但不能为好看而虚构批准。']},
  G10:{inputs:['教学旧窗口20项可比事项：维护与追问合计600分钟；等待历时另记，不与净工时相加。','教学新窗口同类20项：原工作420分钟，新增维护30、人工复核60、异常处理30，共540分钟。','事件揭示新窗口实际更简单，若不能恢复可比样本，前后平均数不能支持因果效果。'],sample:['在原假设成立时净投入由600到540，减少60分钟即10%；分母20项、质量与时间构成必须一并公开。','不要只写原工作600到420减少30%；新增120分钟是工具成本，不可忽略。','事件后将10%降级为非同质窗口观察，不作为已证实节省；按同类事项、复杂度和观察窗口重新配对。','只有质量未下降且维护/复核/异常齐计时，才谨慎描述净收益；等待变短与个人工时、业务结果分别报告。']},
  G11:{inputs:['外部权限与输入完整性需在有限迁移前成立；准备脚本、培训材料可以并行。','有限迁移需责任人、接收方样例和回退演练；演示一次不等于正式切换可行。','外部授权晚于拟定切换日；表格能改日期，但不能改变尚未成立的前提。'],sample:['将验证输入/权限→有限迁移/回退→正式切换/观察列为前置关系，标出可并行准备与不可跳过验证。','领域负责人自愿承接具体交付，业务负责人决定窗口与风险；相关方共同校准样例和回退触发。','权限延期后重排切换，或按已获授权范围缩小；不通过更改里程碑状态宣称授权已完成。','回退本身有执行人、资源与恢复标准；迁移完成、稳定运行和业务收益继续分栏取证。']},
  G12:{inputs:['探索小试点有学习价值但收益未证实；稳定公共能力有质量约束和固定维护成本。','退出低价值维护可以释放未来容量，迁移与停止通知未完成前还不能当可用资源。','新证据提高了稳定性风险，原来的扩围方案不能仅靠在结尾添加风险备注继续。'],sample:['各领域公开证据强度、假设、机会成本与最小可执行条件；保留探索与稳定两个目标，而非逼所有人同意单一偏好。','至少比较“小试点+必要稳态投入”与“暂停扩围+退出低价值维护”两套组合，说明不做什么和释放资源的前提。','负责人选组织TOP3与风险，领域负责人选择实现、主动承接；不同关切保留在回传，不把统一方向等同于内心完全一致。','风险变化后重新确认组合、容量与验收，不能用“都重要”新增所有工作；事后复看原判断与新证据。']}
 };

globalThis.FACILITATION_CORE = (() => {

 }
 function newAssembly(scale){

 function assemblyStatus(a){return {total:a.groups.length,inputs:a.groups.filter(g=>g.facts.trim()&&g.goal.trim()).length,mandates:a.groups.filter(g=>g.representative.trim()&&g.mandate.trim()).length,dissents:a.groups.filter(g=>g.dissent.trim()).length,returned:a.groups.filter(g=>g.returned).length,ready:a.groups.every(g=>g.facts.trim()&&g.goal.trim()&&g.representative.trim()&&g.mandate.trim()&&g.returned)&&a.decision.trim()&&a.decider.trim()&&a.returnWindow.trim()};}
 function validateAssembly(a){

globalThis.ORGANIZER_CORE = (() => {
 'use strict';
 const scales=EXPANSION_DATA.scales,games=GAME_DATA.games;
 const fieldNames=['purpose','output','facts','authority','when','place','fallback','invitation','dataBoundary'];
 const checkTemplates=[
  ['scope','目的与开放选择已明确','只讨论一个必要对象；已确定与可讨论部分分开。'],
  ['mandate','授权边界已向相关方确认','谁拍方向、谁选实现、谁仅提供建议；缺席者的批准另约。'],

 ];

  const roles=scale==='solo'?['本人（兼推演与核对）']:scale==='trio'?(mode==='rotating'?['成员甲（轮换主持）','成员乙（轮换主持）','成员丙（轮换主持）']:['引导师','参与者甲','参与者乙']):['组织者 / 主引导师','获授权负责人','领域或小组代表','材料与记录负责人',...(['org125','org500'].includes(scale)?['桌主持与总控协调人']:[])];

 function create(template='F4',scale='small',mode){

  if(!games.some(g=>g.id===p.template)||!scaleOf(p.scale)||!modeOptions(p.scale).some(m=>m.id===p.roleMode))throw new Error('筹备模板、规模或角色安排不合法');

  if(!Number.isInteger(p.people)||p.people<bounds[0]||p.people>bounds[1]||!Number.isInteger(p.minutes)||p.minutes<10||p.minutes>1440)throw new Error('筹备人数或可用时长不合法');

  <section class="f-theme-grid">${d.themes.map(t=>`<article class="f-theme"><h3>${esc(t.title)}</h3><p>${esc(t.output)}</p>${btn('按此场景选择','theme',t.id,'compass')}</article>`).join('')}</section><section class="f-calibration"><h2>适用边界</h2><dl><dt>公开关注方向</dt><dd>Phoenix Chen · Agile Coach，关注敏捷协作、引导与决策练习。团队引导、目标规划、创新机制、资源取舍、复盘与客户旅程可作为练习起点；模拟可运行不证明现实效果。</dd><dt>优先验证</dt><dd>选一次新场景观察：是否公开必要上下文、责任人主动领取、相关方共同校准、回传准确；净效率和业务结果另测。</dd><dt>必须协作</dt><dd>125–500人需要授权代表、桌主持与总控支持；不把整个组织的交付归于一位引导师。单人只做准备和推演。</dd><dt>不适用</dt><dd>无合法资料、无决策授权却要求承诺、强迫和解、把心理学当诊断、把小游戏当绩效考核。</dd></dl></section>`,'快速选玩法');

 function assemblyPage(){assembly||=c.newAssembly('org125');const a=assembly,st=c.assemblyStatus(a),shown=a.groups.filter(g=>(!query||Object.values(g).some(v=>String(v).toLowerCase().includes(query.toLowerCase())))&&(!gaps||!g.facts.trim()||!g.goal.trim()||!g.mandate.trim()||!g.returned));

iv><div id="f-feedback" aria-live="polite"></div></section><footer class="x-footer"><span id="f-save">${storageOK?'组织输入存于此浏览器':'仅本次会话，请导出 JSON'}</span><p>与原单局和战役/对话记录分别备份。授权和回传勾选是人工填写的状态，不是系统认证。每组原始输入应保留，不以中央摘要覆盖。</p></footer>`,'组织输入与回传');save();

 function board(g,s,h){const {input,select,note,item}=h,k=g.config.kind,items=g.config.items;let body='';
  const rows=markup=>items.map(i=>item(i.label,markup(i),i.detail)).join('');
  if(k==='sequence')body=rows(i=>select(s,`order_${i.id}`,['1','2','3'],'推进次序')+input(s,`condition-${i.id}`,'进入条件、允许并行与回退'));
  if(k==='portfolio')body=rows(i=>select(s,`pick-${i.id}`,['纳入','替代原任务后纳入','延期','停止','待确认'],`选择 / ${i.cost} 教学点`)+input(s,`trade-${i.id}`,'放弃什么、释放什么、谁批准'))+note(s,'package','第二套组合与最大反证');
  if(k==='journey')body=rows(i=>input(s,`task-${i.id}`,'用户/学习者的真实任务')+input(s,`fact-${i.id}`,'实际观察、来源与样本')+input(s,`hypothesis-${i.id}`,'解释与替代解释')+input(s,`verify-${i.id}`,'下一次验证'));
  if(k==='cause')body=rows(i=>input(s,`observation-${i.id}`,'实际观察与来源')+input(s,`mechanism-${i.id}`,'机制假设（非人格判断）')+input(s,`counter-${i.id}`,'最大反证与同期变化')+input(s,`experiment-${i.id}`,'最小改变、主动承接者和复看'));
  if(k==='coverage')body=rows(i=>select(s,`coverage-${i.id}`,['有直接来源','仅代表推测','需要原参与人确认','信息不足'],'覆盖状态')+input(s,`voice-${i.id}`,'已听到谁，谁还未被代表')+input(s,`return-${i.id}`,'代表授权、少数意见与回传'));
  if(k==='agreement')body=rows(i=>input(s,`behavior-${i.id}`,'可观察行为，不写性格或态度口号')+input(s,`exception-${i.id}`,'例外与协商方式')+input(s,`maintain-${i.id}`,'共同确认、维护者与修订窗口'));
  if(k==='gate')body=rows(i=>select(s,`stage-${i.id}`,['只有意图','有方案或演示','有真实试点证据','已明确采用','效果仍需验证','停止或待确认'],'当前最高支持状态')+input(s,`proof-${i.id}`,'证据路径/来源与未证实')+input(s,`gate-${i.id}`,'进入下一阶段/退出的条件和批准者'));
  if(k==='matrix')body=rows(i=>select(s,`evidence-${i.id}`,['直接证据','合理推断','信息不足'],'证据强度')+select(s,`criteria-${i.id}`,['价值证据','可实现性','可维护性','风险约束','个人偏好'],'目前主要依据')+input(s,`limit-${i.id}`,'适用范围、关联利益与机会成本'));
  if(k==='authority')body=rows(i=>select(s,`authority-${i.id}`,['本人有明确授权','只能提议','需负责人批准','需回组确认','不可代签'],'授权边界')+input(s,`mandate-${i.id}`,'授权原句与批准者')+input(s,`notify-${i.id}`,'回传对象、未决项与期限'));
  if(k==='conflict')body=rows(i=>select(s,`continue-${i.id}`,['自愿继续共同讨论','分别澄清后再判断','暂停','转正式组织程序'],'过程选择')+input(s,`fact-${i.id}`,'具体事实与当事人愿意公开的影响')+input(s,`need-${i.id}`,'关切、选择权和边界'))+note(s,'stop','何时停止，谁提供正式支持；不采集隐私或强迫和解');
  return body+`<div id="f-board-check"></div>`;
 }
 function check(g,s){const k=g.config.kind,v=s.inputs,lines=[];if(k==='sequence'){const out=c.checkSequence(g.config.items,g.config.edges,v);lines.push(out.incomplete?'次序尚未填写完整。':'三个节点已有次序。');if(out.duplicates)lines.push('有相同次序；说明是允许并行还是重复，别隐藏前提。');if(out.inversions.length)lines.push('前置与后续次序倒置，需要核对依赖或明确新的允许条件。');}
  if(k==='portfolio'){const used=g.config.items.reduce((n,i)=>n+(['纳入','替代原任务后纳入'].includes(v[`pick-${i.id}`])?i.cost:0),0),budget=s.event?g.config.eventBudget:g.config.budget;lines.push(`${used}/${budget} 教学点；${used>budget?'超过容量，需取舍':'未超明示容量，但不证明值得'}。换出任务要核实释放容量和相关方同意。`);}
  const prompts={journey:'旅程里的情绪和原因需要当事人证据；统计位置不自动说明原因。',cause:'机制假设须保留反证、基线、同期变化与复看；工作系统复盘不诊断人格。',coverage:'代表性与授权分开；缺口有确认人，不把少数意见丢掉。',agreement:'约定由参与人形成和试用；可观察行为、例外与修订比口号有用。',gate:'每阶段的证据独立；获奖、演示、试点、采用与效果不可互换。',matrix:'评价标准和偏好公开，关联利益按制度处理；评分不替负责人投入决定。',authority:'授权不随代表自动转移。引导师过程权不包含替别人承诺资源。',conflict:'自愿、事实、影响与需要先行；安全/纪律事件转正式渠道，不强迫和解。'};
  if(prompts[k])lines.push(prompts[k]);if(k==='conflict'&&s.event)lines.push('事件中一方不愿公开继续；不能将继续共同讨论视为已获同意。先暂停或另外确认自愿且安全的安排。');lines.push('结构核对不等于已经实施；真实决定、采用、效能与个人贡献分别取证。');return lines;
 }
 return {mount,board,check,planText};
})();

globalThis.ORGANIZER_UI = (() => {

 };

  if(step===2)content=`<h2>拟议议程</h2><p class="helper">${esc(s.prep)}</p><div class="button-row">${button('套用核心议程','agenda-core','','rotate-ccw')}${button(`压缩为 ${s.lightMinutes||30} 分钟筹备议程`,'agenda-light','','clock-3')}${button('增加环节','agenda-add','','plus')}</div>${plan.agenda.map((a,i)=>`<section class="o-agenda-row"><div class="field-row">${field(`环节 ${i+1}`,a.title,'title',{section:'agenda',index:i})}${field('分钟',a.minutes,'minutes',{section:'agenda',index:i,number:[1,360]})}</div><div class="o-row-tools">${i?`<button class="icon-btn" data-o-action="agenda-up" data-o-value="${i}" title="上移环节" aria-label="上移环节 ${i+1}">${icon('arrow-up')}</button>`:''}${i<plan.agenda.length-1?`<button class="icon-btn" data-o-action="agenda-down" data-o-value="${i}" title="下移环节" aria-label="下移环节 ${i+1}">${icon('arrow-down')}</button>`:''}<button class="icon-btn" data-o-action="agenda-remove" data-o-value="${i}" title="移除环节" aria-label="移除环节 ${i+1}"${plan.agenda.length===1?' disabled':''}>${icon('x')}</button></div></section>`).join('')}<h2>准备材料</h2>${plan.materials.map((m,i)=>`<section class="o-row"><div class="field-row">${field('材料',m.title,'title',{section:'materials',index:i})}${field('准备者',m.owner,'owner',{section:'materials',index:i})}${field('会前准备期限',m.due,'due',{section:'materials',index:i})}</div>${checkbox('已准备并检查',m.ready,'materials',i)}<button class="icon-btn o-remove" data-o-action="material-remove" data-o-value="${i}" title="移除材料" aria-label="移除材料 ${i+1}"${plan.materials.length===1?' disabled':''}>${icon('x')}</button></section>`).join('')}${button('增加材料','material-add','','plus')}${field('设备、纸面、场地、休息与不能同场时的备用安排',plan.fields.fallback,'fallback',{long:true})}`;

 function edit(t,commit=false){

  function controlNumbers(game,s,defaults) { return `<div class="field-row">${game.config.items.map(i=>input(s,i.id,i.label,i.detail,'number',defaults[i.id]??0)).join('')}</div>`; }

      case 'career':{const track=val(s,'track','工作流诊断');body=`<div class="choice-buttons">${['工作流诊断','资源决策支持','团队决策引导'].map(t=>`<button class="choice ${track===t?'active':''}" data-choice="track" data-value="${t}">${t}</button>`).join('')}</div>${cfg.items.filter(i=>i.track===track).map(i=>item(`${i.kind}任务：${i.label}`,`${note(s,`task-${i.id}`,'本次实际判断或动作')}<div class="field-row">${select(s,`engage-${i.id}`,['1 很低','2 较低','3 一般','4 较高','5 很高'],'投入感')}${select(s,`repeat-${i.id}`,['愿意重复','需要改变条件','暂不想重复','尚未实际尝试'],'愿意重复？')}${select(s,`familiar-${i.id}`,['熟悉','部分熟悉','陌生'],'熟悉度')}${input(s,`drain-${i.id}`,'消耗与让你犹豫的部分')}</div>`,i.detail)).join('')}`;break;}
      case 'portable':body=cfg.items.map(i=>item(i.label,`<label class="select-line"><input type="checkbox" data-input="remove-${i.id}"${checked(val(s,`remove-${i.id}`,false))}><span>本轮移除这项条件</span></label>${val(s,`remove-${i.id}`,false)?`<div class="revealed">${i.detail}</div>${input(s,`replace-${i.id}`,'替代输入 / 授权 / 缩小方式')}`:''}`)).join('')+note(s,'minimum','移除条件后的最小交付与拒绝条件');break;
      case 'transfer':body=select(s,'scene',cfg.items.map(i=>i.label),'迁移到哪个场景')+select(s,'method',['状态分层','依赖握手','共同验收'],'只选一种方法')+`<div class="materials">${cfg.items.map(i=>`<div class="material"><h3>${i.label}</h3><p>${i.detail}</p></div>`).join('')}</div>${note(s,'agreement','一页普通语言约定','对象、最少记录、维护人、确认方式、不适用与退出。')}<div id="transfer-check"></div>`;break;

  }
  function live(game,s) {
    const cfg=game.config;
    if(game.engine==='negotiation')EXPANSION_UI.negotiationLive(game,s);
    if(game.engine==='priority') {const picks=cfg.items.filter(i=>val(s,`pick-${i.id}`,false));const budget=s.event?cfg.eventBudget:cfg.budget;const sum=picks.reduce((n,i)=>n+i.cost,0);if($('#priority-sum'))$('#priority-sum').textContent=`${picks.length}/3 项 · ${sum}/${budget} 点`;}
    if(game.engine==='claim') {const loads=cfg.owners.map(o=>{const capacity=o.name==='研发'&&s.event?2:o.capacity;const use=cfg.items.filter(i=>val(s,`claim-${i.id}`)===o.name).reduce((n,i)=>n+i.cost,0);return `<div><small>${o.name}</small><strong class="${use>capacity?'warn':''}">${use}/${capacity}</strong></div>`;});if($('#claim-capacity'))$('#claim-capacity').innerHTML=`<div class="live-result" style="grid-template-columns:repeat(2,1fr)">${loads.join('')}</div>`;}
    let calc='';
    if(game.engine==='cost') {const numbers=Object.fromEntries(Object.keys(cfg.defaults).map(k=>[k,val(s,k,cfg.defaults[k])]));const out=core.cost(numbers);calc=`<div class="live-result"><div><small>启动窗口净节省 / 分钟</small><strong class="${out.net>=0?'good':'warn'}">${round(out.net)}</strong></div><div><small>持续窗口净节省 / 分钟</small><strong class="${out.recurring>=0?'good':'warn'}">${round(out.recurring)}</strong></div><div><small>启动窗口回本 / 次</small><strong>${out.breakEven===null?'无法回本':out.breakEven}</strong></div></div><p class="formula">每轮净省 ${round(out.perRun)} 分钟；净收益还需扣除窗口维护与适用的搭建成本。</p>`;}
    if(game.engine==='denominator') {const v=Object.fromEntries(Object.keys(cfg.defaults).map(k=>[k,val(s,k,cfg.defaults[k])]));const out=core.rates(v);calc=`<div class="live-result"><div><small>全收到请求完成占比</small><strong>${percent(out.complete)}</strong></div><div><small>已明确完成 / 失败样本比例</small><strong>${percent(out.known)}</strong></div><div><small>原报告口径</small><strong class="${out.suspicious?'warn':''}">${percent(out.reported)}</strong></div></div><p class="formula">合计 ${out.total} 条。暂排样本需另行核验；第二项不能自动称为合法边界内完成率。</p>`;}
    if(game.engine==='offer') {const v=Object.fromEntries(Object.keys(cfg.defaults).map(k=>[k,val(s,k,cfg.defaults[k])]));const out=core.offer(v);calc=`<div class="live-result"><div><small>本局可用容量</small><strong>${out.available}</strong></div><div><small>本局所需容量</small><strong>${out.required}</strong></div><div><small>模型检查</small><strong class="${out.feasible?'good':'warn'}">${out.feasible?'可行':'需调整'}</strong></div></div><p class="formula">可用 = 周数 + 支持×2 + 明确维护×2；所需 = 范围×3。可行不等于业务值得。</p>`;Object.keys(cfg.defaults).forEach(k=>{if($(`#range-${k}`))$(`#range-${k}`).textContent=v[k];});}
    if(game.engine==='compare') {const a=['aGenerate','aReview','aFix'].reduce((n,k)=>n+Number(val(s,k,cfg.defaults[k])),0);const b=['bGenerate','bReview','bFix'].reduce((n,k)=>n+Number(val(s,k,cfg.defaults[k])),0);calc=`<div class="live-result"><div><small>甲总分钟</small><strong>${round(a)}</strong></div><div><small>乙总分钟</small><strong>${round(b)}</strong></div><div><small>来源</small><strong style="font-size:17px">预置假设</strong></div></div>`;}
    if($('#live-calculation'))$('#live-calculation').innerHTML=calc;
    if(game.engine==='transfer'&&$('#transfer-check')) {const text=s.notes.agreement||'';const found=cfg.banned.filter(word=>text.toLowerCase().includes(word.toLowerCase()));$('#transfer-check').innerHTML=`<p class="helper">${found.length?`还出现惯用术语：${found.join('、')}`:'未发现本局禁词；这不证明对方已理解。'}</p>`;}
    if(game.engine==='interest'&&$('#interest-summary')) {const chosen=cfg.items.filter(i=>val(s,`try-${i.id}`,false));const actual=chosen.filter(i=>val(s,`done-${i.id}`,false));$('#interest-summary').innerHTML=`<p class="rating-summary">选了 ${chosen.length} 项，实际尝试 ${actual.length} 项。${chosen.length>2?'可以先缩为两项，避免把兴趣变成任务队列。':'未尝试的评分只能表示期待，不能归为真实体验。'}</p>`;}

  const round=n=>Math.round(n*10)/10;
  const percent=n=>n===null?'不可计算':`${round(n)}%`;
  function check(game,s) {
    const cfg=game.config, lines=[];
    const filled=key=>String(val(s,key)).trim().length>0;
    switch(game.engine) {
      case 'negotiation':lines.push(...EXPANSION_UI.negotiationCheck(game,s));break;
      case 'facilitation':lines.push(...FACILITATION_UI.check(game,s));break;

  function route() {
    let hash;try{hash=decodeURIComponent(location.hash.slice(1)||'overview');}catch{hash='library';}
    if(hash==='organizer'){current=null;view=hash;ORGANIZER_UI.mount(hash,{frame,icon,escape,toast,download});return;}
    if(['overview','assembly'].includes(hash)){current=null;view=hash;FACILITATION_UI.mount(hash,{frame,icon,escape,toast,download});return;}
    if(/^(campaign(?:\/[a-zA-Z0-9_-]+)?|workshop|lab(?:\/[a-zA-Z0-9_-]+)?)$/.test(hash)){
      current=null;view=hash.split('/')[0];EXPANSION_UI.mount(hash,{frame,icon,escape,toast,download});return;
    }
    const candidate=hash.match(/^game\/([A-Z][0-9]{1,2})(?:\/([0-4]))?$/);
    const match=candidate&&games.some(g=>g.id===candidate[1])?candidate:null;
    if(match) {const game=games.find(g=>g.id===match[1]);view='game';if(match[2]!==undefined)session(game).step=Number(match[2]);gamePage(game);}
    else if(hash==='records'){view='records';records();}
    else if(hash==='about'){view='about';about();}
    else {view=hash==='favorites'?'favorites':'library';const f=hash.match(/^family-([A-G])$/);filter=f?f[1]:'all';library();}
  }
  function navigate(hash) {if(location.hash===`#${hash}`)route();else location.hash=hash;}
  function setStep(n) {if(!current)return;session(current).step=n;persist(current);navigate(`game/${current.id}/${n}`);$('#main')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
  function modal(title,body) {$('#dialog').innerHTML=`<div class="dialog-body"><div class="dialog-head"><h2>${title}</h2><button class="icon-btn" data-action="close-dialog" title="关闭" aria-label="关闭">${icon('x')}</button></div>${body}</div>`;if(!$('#dialog').open)$('#dialog').showModal();EXPANSION_UI.decorateModal();}
  function backup() {modal('备份与迁移',`<p>导出 JSON 可迁移进度，Markdown 用于阅读。导出文件包含你填写的内容，分享前请脱敏。当前为${storageOK?'本地保存':'仅会话保存'}。</p><div class="button-row"><button class="btn primary" data-action="export-json">${icon('download')}导出 JSON</button><button class="btn" data-action="export-md">${icon('file-text')}导出 Markdown</button><button class="btn" data-action="import">${icon('upload')}导入记录</button></div><p style="margin-top:20px">导入按更新时间合并，不会静默覆盖较新的同局记录。同一局保留一个活动版本；需要多次试玩时，先导出上一局。</p>`);}
  function prompt(game) {
    const roles=game.roles.map(r=>`${r.name}\n公开开场：${r.opening}\n私有上下文：${r.context}\n希望：${r.want}\n边界：${r.boundary}`).join('\n\n');
    return `请主持一场名为“${game.title}”的虚构练习。我是玩家；你按需要扮演各角色，但不替我作判断。\n\n练习目的：${game.mission}\n情境：${game.scene}\n\n角色资料（主持人保留，逐轮按合理提问揭示）：\n${roles}\n\n桌面材料：\n${game.materials.map(m=>`${m.title}：${m.text}`).join('\n')}\n\n轮次：\n${game.rounds.map((r,n)=>`${n+1}. ${r}`).join('\n')}\n\n操作对象：\n${game.config.items.map(i=>`${i.label}：${i.detail||i.answer||'根据角色约束组织选择'}`).join('\n')}\n完整规则参数：${JSON.stringify(game.config,null,2)}\n\n初始选择完成后再揭示变化事件：${game.event.title}。${game.event.text}\n\n交付：${game.deliverables.join('；')}\n复盘：${game.debrief.join('；')}\n\n主持约束：一次只推进一个必要问题；不预设明确冲突，不把沉默当同意；方向和重大风险由获授权负责人拍板，实现方式与承诺由参与人选择；不默认真实组织会议不执行。不要讨好玩家，也不要凭空替现实人物作心理诊断。所有新资料必须标为虚构。只对明示规则和来源核对，不把练习表现当作职业能力或市场需求证明。游戏中人物和数字不是任何真实公司的事实。\n\n迁移限制：${game.transfer}\n请从简短开场和本轮需要我作出的选择开始，不先展示参考答案。`;
  }
  function recordLabel(game,key) {
    const common={opening:'开场与本次选择',decision:'初始安排与依据',event:'变化后的调整',reflection:'判断与反证',transfer:'真实观察与迁移',alternative:'替代组合',mechanism:'机制假设',retest:'复测安排',offers:'条件包比较',counterexample:'最大反证',minimum:'最小交付与拒绝条件',agreement:'普通语言约定',authority:'负责人选择与相关方协商',reading:'仅阅读',checked:'已核对本局记录',elapsed:'累计练习秒数',cutoff:'观察截止日',asof:'截止日状态',intervention:'单一干预点',scene:'迁移场景',method:'所选方法',service:'所选服务',oneLine:'一句话交付',observe:'观察对象',observed:'实际观察状态',when:'观察条件',track:'体验工作日', 'small-change':'小改善或不改'};
    if(common[key])return common[key];
    const exact=game.config.items.find(i=>i.id===key);if(exact)return exact.label;
    const prefixes={pick:'纳入组合',quarter:'安排季度',provider:'提供方',receiver:'接收方',object:'交付对象',window:'窗口与条件',accept:'验收方式',notify:'变化通知',claim:'领取人',target:'验收对象',definition:'验收口径',source:'来源与窗口',threshold:'标准与未知',who:'共同确认人',form:'确认形式',state:'证据层级',hyp:'保留解释',changed:'提问作用',h0:'对解释甲',h1:'对解释乙',stress:'变化处理',branch:'介入选择',reason:'介入依据',task:'任务判断',engage:'投入感',repeat:'愿意重复',familiar:'熟悉度',drain:'消耗',remove:'移除条件',replace:'替代输入',answer:'追问回答',proof:'回答证据边界',try:'所选活动',expect:'尝试前期待',actual:'实际投入感',again:'下一次选择',done:'已实际尝试',condition:'消耗与体验条件'};
    for(const entry of game.config.items){const suffix=`-${entry.id}`;if(key.endsWith(suffix)){const prefix=key.slice(0,-suffix.length);return `${entry.label} / ${prefixes[prefix]||({'flag-a':'甲需要核对','flag-b':'乙需要核对'}[prefix]||prefix)}`;}}
    const observation=key.match(/^(fact|explain|alternate|unknown)-(\d)$/);if(observation)return `观察 ${observation[2]} / ${{fact:'事实',explain:'解释一',alternate:'替代解释',unknown:'未知'}[observation[1]]}`;
    const time=key.match(/^([ab])(Generate|Review|Fix)$/);if(time)return `${time[1]==='a'?'甲':'乙'} / ${{Generate:'生成分钟',Review:'审阅分钟',Fix:'修订分钟'}[time[2]]}`;
    return key;
  }
  function recordValue(game,key,value) {
    if(typeof value==='boolean')return value?'是':'否';
    if(game.engine==='timeline'&&key==='cutoff')return game.config.items[value]?.label||value;
    if(game.engine==='branch'&&key.startsWith('branch-')){const entry=game.config.items.find(i=>key===`branch-${i.id}`);return entry?.options.find(o=>o.id===value)?.label||value;}
    return value;
  }
  function markdown(selected) {
    const list=selected||games.filter(g=>store.sessions[g.id]?.openedAt);
    return `# Phoenix Chen · 决策游乐场个人记录\n\n导出：${new Date().toISOString()}\n\n此文件可能包含个人填写内容；分享前请脱敏。模拟记录不证明真实业务成果、心理特征或市场需求。\n\n`+list.map(g=>{
      const s=store.sessions[g.id]||session(g);
      return `## ${g.id} ${g.title}\n\n状态：${s.completed?'已归档':'进行中'}${s.inputs.reading?' / 仅阅读':''}\n更新：${s.updatedAt}\n情境：${g.scene}\n\n`+Object.entries(s.notes).filter(([,v])=>v).map(([k,v])=>`### ${recordLabel(g,k)}\n\n${v}\n`).join('\n')+`\n### 操作记录\n\n${Object.entries(s.inputs).map(([k,v])=>`- ${recordLabel(g,k)}：${recordValue(g,k,v)}`).join('\n')}\n\n揭示信息：${s.revealed.map(id=>g.config.items.find(i=>i.id===id)?.label||id).join('、')||'无'}\n迁移边界：${g.transfer}\n`;
    }).join('\n---\n\n');
  }
  function printGame(game) {
    const s=session(game);$('#print-zone').innerHTML=`<header><div class="print-tag">Phoenix Chen · 决策游乐场 / ${game.id} / ${s.completed?'已归档':'进行中'}</div><h1>${game.title}</h1><p>${game.subtitle}</p></header><p>${game.scene}</p><h2>本局选择与记录</h2>${Object.entries(s.notes).filter(([,v])=>v).map(([k,v])=>`<div class="print-item"><h3>${escape(recordLabel(game,k))}</h3><div class="print-answer">${escape(v)}</div></div>`).join('')}<h2>操作记录</h2><ul>${Object.entries(s.inputs).map(([k,v])=>`<li>${escape(recordLabel(game,k))}：${escape(recordValue(game,k,v))}</li>`).join('')}</ul><h2>复盘问题</h2><ol>${game.debrief.map(q=>`<li>${q}</li>`).join('')}</ol><h2>迁移边界</h2><p>${game.transfer}</p><p class="print-tag">所有情境与数字为虚构；记录不是能力认证或真实业务成果。${new Date().toLocaleDateString('zh-CN')}</p>`;window.print();
  }
  function clockText(seconds) {const n=Math.max(0,Math.floor(seconds));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
  document.addEventListener('click',async e=>{
    const t=e.target.closest('button,[data-open],[data-nav],[data-step],[data-export]');if(!t)return;
    if(t.dataset.nav){$('#dialog').close();navigate(t.dataset.nav);return;}
    if(t.dataset.open){navigate(`game/${t.dataset.open}`);return;}
    if(t.dataset.filter){filter=t.dataset.filter;search='';statusFilter='all';if(view==='favorites'){library();}else navigate(filter==='all'?'library':`family-${filter}`);return;}
    if(t.dataset.star){const game=games.find(g=>g.id===t.dataset.star);let s=store.sessions[game.id];if(!s){s={step:0,notes:{},inputs:{},revealed:[],event:false,completed:false,starred:false,updatedAt:new Date().toISOString()};store.sessions[game.id]=s;}s.starred=!s.starred;persist();current?gamePage(current):library();return;}
    if(t.dataset.step!==undefined){setStep(Number(t.dataset.step));return;}
    if(t.dataset.route){const r=data.routes.find(r=>r.id===t.dataset.route);routeNotice=`当前路线：${r.title} / ${r.ids.join(' → ')}`;store.route=r.id;navigate(`game/${r.ids[0]}`);return;}
    if(t.dataset.export){const game=games.find(g=>g.id===t.dataset.export);download(`${game.id}-${game.title}-记录.md`,markdown([game]));return;}
    if(t.dataset.choice&&current){const s=session(current);const value=t.dataset.choice==='cutoff'?Number(t.dataset.value):t.dataset.value;s.inputs[t.dataset.choice]=value;persist(current);gamePage(current);return;}
    if(t.dataset.reveal&&current){const s=session(current);if(s.revealed.includes(t.dataset.reveal))return;if(current.config.limit&&s.revealed.length>=current.config.limit){toast('本轮信息预算已用完');return;}s.revealed.push(t.dataset.reveal);persist(current);gamePage(current);return;}
    const action=t.dataset.action;
    if(action==='close-dialog'){$('#dialog').close();return;}
    if(action==='type'){largeType=!largeType;document.body.classList.toggle('large-type',largeType);t.classList.toggle('on',largeType);return;}
    if(action==='backup'){backup();return;}
    if(action==='menu'){modal('游戏导航',`<div class="menu-drawer"><button class="nav-btn" data-nav="library">${icon('layout-grid')}全部游戏</button>${families.map(f=>`<button class="nav-btn" data-nav="family-${f.id}">${icon(f.icon)}${f.title}</button>`).join('')}<button class="nav-btn" data-nav="records">${icon('notebook-pen')}我的记录</button><button class="nav-btn" data-nav="favorites">${icon('bookmark')}收藏</button><button class="nav-btn" data-action="backup">${icon('folder-down')}备份与迁移</button><a class="nav-btn" href="完整游戏手册.html" target="_blank">${icon('book-open')}完整手册</a><button class="nav-btn" data-nav="about">${icon('circle-help')}边界与主持约定</button></div>`);return;}
    if(action==='export-json'){download('决策游乐场-个人记录.json',JSON.stringify({...store,exportedAt:new Date().toISOString()},null,2),'application/json');toast('记录已导出；分享前请脱敏');return;}
    if(action==='export-md'){download('决策游乐场-全部记录.md',markdown());return;}
    if(action==='import'){$('#import-file').click();return;}
    if(action==='copy-prompt'){const area=$('#prompt-text');try{await navigator.clipboard.writeText(area.value);toast('主持提示词已复制');}catch{area.focus();area.select();toast('浏览器限制自动复制，提示词已选中');}return;}
    if(action==='download-prompt'){download(`${current.id}-${current.title}-主持提示词.txt`,prompt(current));return;}
    if(!current)return;
    const game=current,s=session(game);
    if(action==='check'){check(game,s);return;}
    if(action==='event'){s.event=true;persist(game);gamePage(game);return;}
    if(action==='back-board'){setStep(1);return;}
    if(action==='prompt'){modal(`${game.id} · 完整主持提示词`,`<p>仅包含虚构材料，不附带你的记录。外部 AI 是可选扩展，页面自身没有实时模型。</p><textarea id="prompt-text" readonly aria-label="完整主持提示词">${escape(prompt(game))}</textarea><div class="button-row"><button class="btn" data-action="download-prompt">${icon('download')}下载文本</button><button class="btn primary" data-action="copy-prompt">${icon('copy')}复制提示词</button></div>`);return;}
    if(action==='save-offer'){const v=Object.fromEntries(Object.keys(game.config.defaults).map(k=>[k,val(s,k,game.config.defaults[k])]));const o=core.offer(v);s.notes.offers=(s.notes.offers||'')+`${s.notes.offers?'\n':''}${v.weeks} 周 / 范围 ${v.scope} / 支持 ${v.support} / 维护 ${v.ownership?'明确':'未明'}：所需 ${o.required}，可用 ${o.available}，${o.feasible?'模型可行':'需调整'}。`;persist(game);gamePage(game);toast('条件包已保留，可继续调整第二套');return;}
    if(action==='export-game'){download(`${game.id}-${game.title}-记录.md`,markdown([game]));return;}
    if(action==='print-game'){printGame(game);return;}
    if(action==='reset-game'){modal('重新开始这一局',`<p>将清空 ${game.id} 的当前笔记、选择和进度；收藏保留。重新开始前可先导出旧记录。</p><div class="button-row"><button class="btn" data-action="export-game">先导出旧记录</button><button class="btn danger" data-action="confirm-reset">确认重新开始</button></div>`);return;}
    if(action==='confirm-reset'){const star=s.starred;delete store.sessions[game.id];session(game).starred=star;persist(game);$('#dialog').close();navigate(`game/${game.id}/0`);return;}
    if(action==='complete'){
      if(!(s.notes.reflection||'').trim()||!(s.notes.transfer||'').trim()){toast('先留下一个判断与反证，以及下一次观察或停止的选择');return;}
      if(!s.inputs.reading&&!s.inputs.checked&&!s.revealed.length&&!Object.keys(s.inputs).some(k=>!['elapsed','reading'].includes(k))){toast('尚无操作记录；可以返回操作，或勾选本次仅阅读');return;}
      s.completed=true;persist(game);gamePage(game);toast('这一局已归档');return;
    }
    if(action==='next-game'){const r=data.routes.find(r=>r.id===store.route);const sequence=r&&r.ids.includes(game.id)?r.ids:games.map(g=>g.id);const next=sequence[sequence.indexOf(game.id)+1];next?navigate(`game/${next}`):navigate('records');return;}
    if(action==='timer'){if(timer.id!==game.id){timer={id:game.id,seconds:Number(s.inputs.elapsed)||0,running:false};}timer.running=!timer.running;gamePage(game);return;}
    if(action==='timer-reset'){timer={id:game.id,seconds:0,running:false};s.inputs.elapsed=0;persist(game);gamePage(game);return;}
  });
  document.addEventListener('input',e=>{
    const t=e.target;
    if(t.id==='search'){search=t.value;const pos=t.selectionStart;library();const field=$('#search');field.focus();field.setSelectionRange?.(pos,pos);return;}
    if(!current)return;const s=session(current);
    if(t.dataset.note){s.notes[t.dataset.note]=t.value;saveLater(current);if(current.engine==='transfer')live(current,s);}
    if(t.dataset.input){s.inputs[t.dataset.input]=readControl(t);saveLater(current);live(current,s);}
  });
  document.addEventListener('change',e=>{
    const t=e.target;if(t.id==='status-filter'){statusFilter=t.value;library();return;}
    if(t.dataset.input&&current){const game=current,s=session(game);s.inputs[t.dataset.input]=readControl(t);persist(game);if(['portable','interest'].includes(game.engine)&&t.type==='checkbox')gamePage(game);else live(game,s);}
  });
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.open){e.preventDefault();navigate(`game/${e.target.dataset.open}`);}});
  $('#import-file').addEventListener('change',async e=>{
    const file=e.target.files[0];if(!file)return;
    try {if(file.size>2_000_000)throw new Error('文件过大，请使用本游戏库导出的 JSON');const incoming=core.validateImport(JSON.parse(await file.text()),games);let merged=0,kept=0;for(const [id,s]of Object.entries(incoming.sessions)){const old=store.sessions[id];if(!old||Date.parse(s.updatedAt||'1970-01-01')>Date.parse(old.updatedAt||'1970-01-01')){store.sessions[id]=s;merged++;}else kept++;}if(incoming.route&&!store.route)store.route=incoming.route;persist();$('#dialog').close();route();toast(`已合并 ${merged} 局，保留本地较新或相同的 ${kept} 局`);}catch(error){toast(`未导入：${error.message}`);}finally{e.target.value='';}
  });
  $('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close();});
  window.addEventListener('hashchange',route);
  window.addEventListener('pagehide',()=>{if(timer.id&&timer.running){const g=games.find(g=>g.id===timer.id);session(g).inputs.elapsed=timer.seconds;persist(g);}persist();});
  setInterval(()=>{if(!timer.running||!timer.id)return;timer.seconds++;if(current?.id===timer.id&&$('#timer-value'))$('#timer-value').textContent=clockText(timer.seconds);const game=games.find(g=>g.id===timer.id);session(game).inputs.elapsed=timer.seconds;if(timer.seconds%10===0)persist(game);},1000);
  route();
})();
</script>
